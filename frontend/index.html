<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zimbra · Correo y colaboración para tu empresa</title>

    <!-- Tipografías: Bricolage Grotesque para títulos, Source Sans 3 para texto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Este script corre ANTES de que React cargue. Pone el tema guardado en
      <html data-theme="..."> para que la página no aparezca un instante en
      claro y luego salte a oscuro (el "parpadeo" del tema).
    -->
    <script>
      try {
        var guardado = localStorage.getItem('zimbra_theme')
        var prefiereOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = guardado || (prefiereOscuro ? 'dark' : 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
