services:
  db:
    image: mysql:8.0
    container_name: zimbra_mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=-05:00
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: crm_zimbra
    ports:
      # Puerto 3307 en el host para evitar conflicto con servicios locales en 3306
      - "3307:3306"
    volumes:
      # Ejecuta automáticamente 01_crear_tablas.sql y 02_insertar_datos.sql al iniciar por primera vez
      - ./DB:/docker-entrypoint-initdb.d:ro
      - zimbra_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: zimbra_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Hora de Colombia para las fechas que calcula Python (reportes)
      - TZ=America/Bogota
      # Correos: en local van a Mailpit (bandeja de prueba en http://localhost:8025).
      # Si el .env define CORREO_MODO, SMTP_HOST, etc., esos valores mandan.
      - CORREO_MODO=${CORREO_MODO:-smtp}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5174}

  # Buzón de prueba: atrapa TODOS los correos que envía el backend y los
  # muestra en http://localhost:8025. Nadie recibe correos reales.
  mailpit:
    image: axllent/mailpit:latest
    container_name: zimbra_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # bandeja web
      - "1025:1025"   # SMTP

  frontend:
    build: ./frontend
    container_name: zimbra_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1

volumes:
  zimbra_mysql_data:
    driver: local
